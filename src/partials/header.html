<header class="site-header">
<div class="container site-header__inner">
<a href="index.html" class="logo" aria-label="Balkan Recycling Center – начало">
<svg width="44" height="44" viewBox="24 24 152 152" aria-hidden="true">
<circle cx="136" cy="70" r="10" fill="#E8A93B"></circle>
<path d="M160.6 135 A70 70 0 1 0 39.4 135 L76 94 L93 112 L116 80 Z" fill="none" stroke="#1B2A3F" stroke-width="9" stroke-linejoin="round"></path>
<path d="M50.5 149.5 A70 70 0 0 0 138 158" fill="none" stroke="#23946C" stroke-width="9" stroke-linecap="round"></path>
<path d="M156 146 L131 151 L143 165 Z" fill="#23946C"></path>
</svg>
<span class="logo__text">
<span class="logo__name">BALKAN</span>
<span class="logo__sub">RECYCLING CENTER</span>
</span>
</a>
<button type="button" class="menu-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Отвори менюто">
<svg class="menu-toggle__open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
<svg class="menu-toggle__close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<div class="site-header__right" id="site-menu">
<nav class="site-nav" aria-label="Основно меню">
{{nav}}
</nav>
<a href="contact.html" class="btn btn--primary">Свържете се за партньорство</a>
<span class="lang"><span class="lang__current">БГ</span><span aria-hidden="true">/</span><a href="#" lang="en">EN</a></span>
</div>
</div>
</header>
<script>
(function () {
  var header = document.querySelector('.site-header');
  var toggle = header.querySelector('.menu-toggle');
  function setOpen(open) {
    header.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Затвори менюто' : 'Отвори менюто');
  }
  toggle.addEventListener('click', function () {
    setOpen(toggle.getAttribute('aria-expanded') !== 'true');
  });
  header.querySelectorAll('#site-menu a').forEach(function (link) {
    link.addEventListener('click', function () { setOpen(false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && header.classList.contains('is-open')) { setOpen(false); toggle.focus(); }
  });
})();
</script>
